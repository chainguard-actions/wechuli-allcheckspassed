name: Test Action

on:
  pull_request:
    branches:
      - "main"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: install nodejs
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.4.0"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Test Action
        run: npm run test
