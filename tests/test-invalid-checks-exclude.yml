name: Test malformed checks_exclude JSON fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checks_exclude: '[{"name": "build", '
          poll: "false"
          delay: "0"
          polling_interval: "0"
          retries: "1"
          show_job_summary: "false"
      - name: Assert action failed on malformed input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed checks_exclude, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
