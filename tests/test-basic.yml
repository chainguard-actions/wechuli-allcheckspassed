name: Test basic usage without explicit commit_sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          poll: "false"
          fail_step: "false"
          treat_skipped_as_passed: "true"
          treat_neutral_as_passed: "true"
          verbose: "true"
          show_job_summary: "false"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with default commit_sha"
          echo "PASS"
