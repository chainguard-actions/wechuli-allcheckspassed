name: Test explicit commit_sha input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_sha: ${{ steps.sha.outputs.sha }}
          poll: "false"
          delay: "0"
          polling_interval: "0"
          retries: "1"
          show_job_summary: "false"
      - name: Assert action ran (succeeded or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHECKS: ${{ steps.action.outputs.checks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks: $CHECKS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action evaluated checks for the explicit commit sha"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
