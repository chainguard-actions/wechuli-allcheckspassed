name: Test include_status_commits option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_sha: ${{ github.sha }}
          token: ${{ github.token }}
          include_status_commits: "true"
          poll: "false"
          delay: "0"
          fail_step: "false"
          treat_skipped_as_passed: "true"
          treat_neutral_as_passed: "true"
          show_job_summary: "false"
          verbose: "false"
          retries: "1"
          fail_fast: "false"
          fail_on_missing_checks: "false"

      - name: Assert action completed with include_status_commits
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action step outcome: $OUTCOME"
          echo "PASS: action ran with include_status_commits=true (outcome: $OUTCOME)"
