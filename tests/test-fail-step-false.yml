name: Test fail_step false - step does not fail even on check failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit_sha: ${{ github.sha }}
          token: ${{ github.token }}
          poll: "false"
          delay: "0"
          fail_step: "false"
          fail_fast: "false"
          treat_skipped_as_passed: "false"
          treat_neutral_as_passed: "false"
          show_job_summary: "false"
          verbose: "true"
          retries: "1"
          fail_on_missing_checks: "false"

      - name: Assert step completed without failing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action step outcome: $OUTCOME"
          echo "PASS: action ran with fail_step=false (outcome: $OUTCOME)"
