name: Test with explicit commit_sha input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current commit SHA: $SHA"
      - id: action
        uses: .
        with:
          commit_sha: ${{ steps.get-sha.outputs.sha }}
          token: ${{ github.token }}
          poll: "false"
          fail_step: "false"
          treat_skipped_as_passed: "true"
          treat_neutral_as_passed: "true"
          verbose: "true"
          show_job_summary: "false"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with explicit commit_sha"
          echo "PASS"
